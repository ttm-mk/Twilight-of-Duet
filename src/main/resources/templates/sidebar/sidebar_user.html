<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>
	<aside id="sidebar" th:fragment="sidebar-user">
		<p>◆メニュー◆</p>
<!--		ログインしてない場合-->
			<div th:if = "${session.userId} == null">
				<ul class="sidebar-menu">
					<li>
						<a th:href="@{/login}">ログイン</a>
					</li>
				</ul>
			</div>
			
<!--		ログインしている場合-->
			<div th:unless = "${session.userId} == null">
				<ul class="sidebar-menu">
					<li>
						<a th:href="@{/user}">ユーザー情報</a>
					</li>
					<li>
						<a th:href="@{/user/edit}">ユーザー編集</a>
					</li>
					<li>
						<a th:href="@{/logout}">ログアウト</a>
					</li>
					<li>
						<a>リセット</a>
					</li>
					<li>
						<a>退会</a>
					</li>
		
				</ul>
			</div>
	</aside>

</body>

</html>
