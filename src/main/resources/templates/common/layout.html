<!DOCTYPE html>
<html xmlns;th="http://www.thymeleaf.org" th:fragment="layout(title, body)">
	
	<head>
		<meta charset="UTF-8">
		<link th:href="@{/css/layout.css}" rel="stylesheet" />
		
<!--		フォント設定-->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:ital,wght@0,200..900;1,200..900&family=Klee+One&family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
		
		<title th:replace="${title}">Insert title here</title>
	</head>
	
	<body>
		
		<header th:replace="~{common/header :: layout-header}"></header>
		<article id="container">
<!--			<aside th:replace="~{common/sidebar :: layout-sidebar}"></aside>-->
			<main id="main" th:replace="${body}"></main>
		</article>
		
		<footer th:replace="~{common/footer :: layout-footer}"></footer>
		
	</body>
</html>
