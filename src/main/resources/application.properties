#アプリケーション情報
spring.application.name=TwilightOfDuet
server.servlet.context-path=/TwilightOfDuet
server.port=2102
spring.thymeleaf.cache=false

#DB情報
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xepdb1
spring.datasource.username=todsystem
spring.datasource.password=systemtodpwd

spring.resources.static-locations=classpath:/static/

#アプリケーションテーブル自動作成など開発に役立つもの
#TODO:一番上の子は開発環境に落とした後、テーブルリセット後にマスタデータ作成したのちupdate=>noneに変える
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

